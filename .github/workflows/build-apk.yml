name: Build December Parallax APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; else echo "Missing index.html. Upload the approved game HTML as index.html." && exit 1; fi
          if [ -d assets ]; then cp -r assets www/; fi
      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share
          npm install --save-dev @capacitor/cli
          npx cap init "December Parallax" "com.december.parallax" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Add native Android Downloads bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/december/parallax/MainActivity.kt")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("""package com.december.parallax

          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.provider.MediaStore
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onStart() {
                  super.onStart()
                  bridge?.webView?.addJavascriptInterface(DownloadBridge(this), "AndroidSave")
              }
          }

          class DownloadBridge(private val context: Context) {
              @JavascriptInterface
              fun saveToDownloads(filename: String, base64: String, mimeType: String): String {
                  return try {
                      val safeName = filename.substringAfterLast('/').substringAfterLast('\\\\')
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, safeName)
                          put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS)
                              put(MediaStore.MediaColumns.IS_PENDING, 1)
                          }
                      }
                      val resolver = context.contentResolver
                      val collection = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)
                          MediaStore.Downloads.EXTERNAL_CONTENT_URI
                      else MediaStore.Files.getContentUri("external")
                      val uri = resolver.insert(collection, values) ?: throw Exception("Android не создал файл в Загрузках")
                      try {
                          val bytes = Base64.decode(base64, Base64.DEFAULT)
                          resolver.openOutputStream(uri)?.use { it.write(bytes) }
                              ?: throw Exception("Не удалось открыть файл для записи")
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              val done = ContentValues().apply { put(MediaStore.MediaColumns.IS_PENDING, 0) }
                              resolver.update(uri, done, null, null)
                          }
                          "OK:" + uri.toString()
                      } catch (e: Exception) {
                          resolver.delete(uri, null, null)
                          throw e
                      }
                  } catch (e: Exception) {
                      "ERROR:" + (e.message ?: "Ошибка сохранения")
                  }
              }
          }
          """.replace("          ", ""))
          PY

      - name: Generate snowflake launcher icon
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/pip install --quiet pillow
          .icon-venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import math
          root = Path("android/app/src/main/res")
          densities = [
              ("mdpi", 1, 48, 108),
              ("hdpi", 1.5, 72, 162),
              ("xhdpi", 2, 96, 216),
              ("xxhdpi", 3, 144, 324),
              ("xxxhdpi", 4, 192, 432),
          ]
          def snowflake(size, background):
              scale = 4
              im = Image.new("RGBA", (size*scale, size*scale), background)
              d = ImageDraw.Draw(im)
              c = size*scale/2
              radius = size*scale*0.34
              width = max(2, round(size*scale*0.035))
              def line(a,b,w=width):
                  d.line((a[0]*scale,a[1]*scale,b[0]*scale,b[1]*scale), fill=(255,255,255,255), width=w*scale//scale, joint="curve")
              # Six clean, symmetrical arms with forked crystalline tips.
              for k in range(6):
                  ang = math.radians(-90 + 60*k)
                  ux,uy = math.cos(ang),math.sin(ang)
                  end=(size/2+radius*ux,size/2+radius*uy)
                  line((size/2,size/2),end)
                  for ratio in (0.56,0.76):
                      px=size/2+radius*ratio*ux
                      py=size/2+radius*ratio*uy
                      branch=radius*0.22 if ratio==0.56 else radius*0.18
                      for sign in (-1,1):
                          ba=ang+sign*math.radians(48)
                          line((px,py),(px+branch*math.cos(ba),py+branch*math.sin(ba)))
              im=im.resize((size,size),Image.Resampling.LANCZOS)
              return im
          for name, scale, legacy, foreground in densities:
              folder=root/f"mipmap-{name}"
              folder.mkdir(parents=True,exist_ok=True)
              snowflake(legacy,(0,0,0,255)).save(folder/"ic_launcher.png")
              snowflake(legacy,(0,0,0,255)).save(folder/"ic_launcher_round.png")
              snowflake(foreground,(0,0,0,0)).save(folder/"ic_launcher_foreground.png")
          (root/"mipmap-anydpi-v26").mkdir(parents=True,exist_ok=True)
          (root/"values").mkdir(parents=True,exist_ok=True)
          (root/"values/ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#000000</color></resources>\n')
          adaptive='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>\n'
          (root/"mipmap-anydpi-v26/ic_launcher.xml").write_text(adaptive)
          (root/"mipmap-anydpi-v26/ic_launcher_round.xml").write_text(adaptive)
          PY

      - name: Align Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'GRADLE'

          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' &&
                          details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          GRADLE
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: December-Parallax-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: December Parallax APK build ${{ github.run_number }}
          body: |
            Installable debug APK for December Parallax.
            Download December-Parallax.apk below and open it on Android.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
